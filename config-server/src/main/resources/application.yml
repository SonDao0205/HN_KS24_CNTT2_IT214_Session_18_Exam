server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Mặc định chạy lệnh Maven tại thư mục gốc base-project-dau-gio.
          # Có thể override, ví dụ: CONFIG_REPO_PATH=file:/path/to/config-repo
          search-locations: ${CONFIG_REPO_PATH:file:./config-repo}
